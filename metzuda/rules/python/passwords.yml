rules:
  - id: mtz-login-no-rate-limit-py
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.route('/login', methods=[..., 'POST', ...])
              def $FUNC(...):
                ...
          - pattern: |
              @$APP.route('/login', ...)
              def $FUNC(...):
                ...
      - pattern-not-inside: |
          @$LIMITER.limit(...)
          @$APP.route('/login', ...)
          def $FUNC(...):
            ...
      - pattern-not-inside: |
          @$APP.route('/login', ...)
          @$LIMITER.limit(...)
          def $FUNC(...):
            ...
    message: >-
      Login route found without a rate limiter decorator. This exposes the application to brute force attacks.
    severity: WARNING
    languages: [python]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  - id: mtz-password-reset-no-rate-limit-py
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.route('/forgot-password', methods=[..., 'POST', ...])
              def $FUNC(...):
                ...
          - pattern: |
              @$APP.route('/reset-password', methods=[..., 'POST', ...])
              def $FUNC(...):
                ...
      - pattern-not-inside: |
          @$LIMITER.limit(...)
          def $FUNC(...):
            ...
    message: >-
      Password reset route found without a rate limiter decorator. This exposes the application to enumeration and brute force attacks.
    severity: WARNING
    languages: [python]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  - id: mtz-no-account-lockout-py
    patterns:
      - pattern: |
          @$APP.route('/login', methods=[..., 'POST', ...])
          def $FUNC(...):
            ...
      - pattern-not-inside: |
          @$APP.route('/login', ...)
          def $FUNC(...):
            ...
            $FAILED_ATTEMPTS
            ...
      - pattern-not-inside: |
          @$APP.route('/login', ...)
          def $FUNC(...):
            ...
            $LOCKOUT
            ...
    message: >-
      Login POST route lacks references to failed attempts or lockout mechanisms.
    severity: INFO
    languages: [python]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: LOW

  - id: mtz-session-not-regenerated-py
    patterns:
      - pattern: |
          $USER.password = $HASH_VALUE
      - pattern-not-inside: |
          $USER.password = $HASH_VALUE
          ...
          session.clear()
    message: >-
      Password updated without clearing the session. Ensure session is cleared or regenerated after password changes.
    severity: INFO
    languages: [python]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-384
      confidence: LOW
