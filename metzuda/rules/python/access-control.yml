rules:
  - id: mtz-auth-from-request-body-py
    patterns:
      - pattern-either:
          - pattern: if request.json.get('is_admin') ...
          - pattern: if $DATA.get('role') == 'admin' ...
    message: >-
      Authorization check depends directly on user-controlled request payload.
    severity: ERROR
    languages: [python]
    metadata:
      metzuda-severity: CRITICAL
      cwe: CWE-602
      confidence: HIGH

  - id: mtz-user-enumeration-py
    patterns:
      - pattern-inside: |
          @$APP.route('/login', ...)
          def $FUNC(...):
            ...
      - pattern-either:
          - pattern: jsonify({'error': 'User not found'})
          - pattern: "Email not found"
          - pattern: "'User not found'"
    message: >-
      Login route returns specific error messages that allow user enumeration.
    severity: INFO
    languages: [python]
    metadata:
      metzuda-severity: LOW
      cwe: CWE-204
      confidence: HIGH

  - id: mtz-reset-token-no-expiry-py
    patterns:
      - pattern-either:
          - pattern: $TOKEN = secrets.token_hex(...)
          - pattern: $TOKEN = uuid4(...)
      - pattern-not-inside: |
          $TOKEN = secrets.token_hex(...)
          ...
          $EXP = ...
      - pattern-not-inside: |
          $TOKEN = uuid4(...)
          ...
          $EXP = ...
    message: >-
      Token generated without apparent associated expiry. Reset tokens must expire.
    severity: WARNING
    languages: [python]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-640
      confidence: LOW
