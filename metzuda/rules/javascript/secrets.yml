rules:
  - id: mtz-hardcoded-secret-js
    patterns:
      - pattern: $VAR = "$VAL"
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(api_key|apikey|secret|password|passwd|token|auth_token|access_token|private_key|client_secret).*
      - metavariable-regex:
          metavariable: $VAL
          regex: ^.+$
    message: Hardcoded secret detected in variable $VAR. Storing credentials, passwords, tokens, or private keys directly in source code is unsafe. Use environment variables or a secrets manager.
    severity: ERROR
    languages:
      - javascript
      - typescript
    metadata:
      metzuda-severity: CRITICAL
      cwe: CWE-798
      confidence: HIGH
