rules:
  # ── 10. Hash passwords ─────────────────────────────────────────────────────
  - id: mtz-plaintext-password-storage-js
    pattern-either:
      - pattern: $USER.password = $REQ.body.password
      - pattern: $USER.password = $PASSWORD
      - pattern: password: $REQ.body.password
      - pattern: |
          { ..., password: $P, ... }
    patterns:
      - pattern-either:
          - pattern: $OBJ.password = $VAL
          - pattern: |
              {password: $VAL}
      - pattern-not: $OBJ.password = bcrypt.hash(...)
      - pattern-not: $OBJ.password = bcrypt.hashSync(...)
      - pattern-not: $OBJ.password = await bcrypt.hash(...)
      - pattern-not: $OBJ.password = argon2.hash(...)
      - pattern-not: $OBJ.password = await argon2.hash(...)
    message: >-
      Password may be stored in plaintext. Always hash passwords using bcrypt,
      argon2, or scrypt before storing. Never store or log raw passwords.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: CRITICAL
      cwe: CWE-916
      confidence: MEDIUM

  # ── 10. Weak hashing algorithm ─────────────────────────────────────────────
  - id: mtz-weak-password-hash-js
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: crypto.createHash('md5')
      - pattern: crypto.createHash('sha1')
    message: >-
      MD5 and SHA-1 are cryptographically broken and must not be used for
      password hashing. Use bcrypt, argon2, or scrypt instead.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: CRITICAL
      cwe: CWE-327
      confidence: HIGH

  # ── 11. Rate limit login ────────────────────────────────────────────────────
  - id: mtz-login-no-rate-limit-js
    patterns:
      - pattern-either:
          - pattern: $APP.post('/login', ...)
          - pattern: $APP.post('/auth/login', ...)
          - pattern: $APP.post('/api/login', ...)
          - pattern: $APP.post('/signin', ...)
          - pattern: $APP.post('/auth/signin', ...)
      - pattern-not: $APP.post($PATH, ..., rateLimit(...), ...)
      - pattern-not: $APP.post($PATH, ..., limiter, ...)
      - pattern-not: $APP.post($PATH, ..., loginLimiter, ...)
      - pattern-not: $APP.post($PATH, ..., authLimiter, ...)
    message: >-
      Login route detected without rate limiting middleware. Without rate limiting,
      this endpoint is vulnerable to brute-force and credential stuffing attacks.
      Apply express-rate-limit or similar middleware to login routes.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  # ── 37. Lock accounts after failed logins ──────────────────────────────────
  - id: mtz-no-account-lockout-js
    patterns:
      - pattern-either:
          - pattern: $APP.post('/login', ...)
          - pattern: $APP.post('/auth/login', ...)
      - pattern-not: $APP.post($PATH, ..., lockout, ...)
      - pattern-not: $APP.post($PATH, ..., accountLock, ...)
    message: >-
      Login route may not implement account lockout after failed attempts.
      Without lockout, accounts are vulnerable to brute-force attacks.
      Consider tracking failed attempts and locking after N failures.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: LOW

  # ── 24. Rate limit password resets ─────────────────────────────────────────
  - id: mtz-password-reset-no-rate-limit-js
    patterns:
      - pattern-either:
          - pattern: $APP.post('/forgot-password', ...)
          - pattern: $APP.post('/reset-password', ...)
          - pattern: $APP.post('/auth/reset', ...)
          - pattern: $APP.post('/password/reset', ...)
      - pattern-not: $APP.post($PATH, ..., rateLimit(...), ...)
      - pattern-not: $APP.post($PATH, ..., limiter, ...)
    message: >-
      Password reset endpoint detected without rate limiting. Attackers can
      enumerate users and flood inboxes. Apply rate limiting to this route.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  # ── 25. Reset sessions on password change ──────────────────────────────────
  - id: mtz-session-not-regenerated-on-password-change-js
    patterns:
      - pattern-either:
          - pattern: $USER.password = $HASH
          - pattern: await $USER.update({password: $HASH})
          - pattern: await $USER.save()
      - pattern-not: $REQ.session.regenerate(...)
      - pattern-not: $REQ.session.destroy(...)
    message: >-
      Password change detected without session regeneration. After a password
      change, all existing sessions should be invalidated to prevent session
      fixation. Call req.session.regenerate() or invalidate all user sessions.
    severity: INFO
    languages: [javascript, typescript]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-384
      confidence: LOW
