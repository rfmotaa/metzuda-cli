rules:
  - id: mtz-login-no-rate-limit-java
    patterns:
      - pattern-inside: |
          @PostMapping("/login")
          public $RET $METHOD(...) { ... }
      - pattern-not-inside: |
          @RateLimiter(...)
          @PostMapping("/login")
          public $RET $METHOD(...) { ... }
      - pattern-not-inside: |
          import $PKG.Bucket4j;
          ...
    message: >-
      Login endpoint does not have rate limiting. This exposes the application to brute-force attacks.
    severity: WARNING
    languages: [java]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  - id: mtz-password-reset-no-rate-limit-java
    patterns:
      - pattern-either:
          - pattern-inside: |
              @PostMapping("/forgot-password")
              public $RET $METHOD(...) { ... }
          - pattern-inside: |
              @PostMapping("/reset-password")
              public $RET $METHOD(...) { ... }
      - pattern-not-inside: |
          @RateLimiter(...)
          @PostMapping(...)
          public $RET $METHOD(...) { ... }
    message: >-
      Password reset endpoint missing rate limit. Attackers can spam emails or brute-force reset tokens.
    severity: WARNING
    languages: [java]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-307
      confidence: MEDIUM

  - id: mtz-session-not-invalidated-java
    patterns:
      - pattern-either:
          - pattern: $USER.setPassword($HASH)
          - pattern: $REPO.save($USER)
      - pattern-not-inside: |
          $SESSION.invalidate();
          ...
    message: >-
      Session not invalidated upon password change. This can lead to session fixation or reuse attacks.
    severity: INFO
    languages: [java]
    metadata:
      metzuda-severity: HIGH
      cwe: CWE-384
      confidence: MEDIUM
