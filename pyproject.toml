[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metzuda"
version = "0.1.0"
description = "Security scanner for AI-generated code"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafael Mota Rissoni", email = "rafaelssoni1000@gmail.com" }]
keywords = ["security", "static-analysis", "ai", "vibe-coding", "semgrep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "anthropic>=0.25.0",
    "semgrep>=1.70.0",
    "pyyaml>=6.0",
    "pyperclip>=1.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://metzuda.dev"
Repository = "https://github.com/rfmotaa/metzuda-cli"
"Bug Tracker" = "https://github.com/rfmotaa/metzuda-cli/issues"
Changelog = "https://github.com/rfmota/metzuda-cli/blob/main/CHANGELOG.md"

[project.scripts]
metzuda = "metzuda.cli.main:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["metzuda"]

[tool.hatch.build.targets.wheel.force-include]
"metzuda/rules" = "metzuda/rules"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["metzuda"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["repoTests/tests"]
addopts = "-v --tb=short"